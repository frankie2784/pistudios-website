<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pi Studios</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@300;400;500&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #07070f;
      --fg:     #f0ede8;
      --muted:  #6e6e8a;
      --accent: #c9a227;
      --serif:  'Playfair Display', Georgia, serif;
      --mono:   'IBM Plex Mono', monospace;
      --sans:   'DM Sans', sans-serif;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--sans);
    }

    /* ── NOISE OVERLAY ── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      background-size: 180px 180px;
      opacity: 0.028;
      pointer-events: none;
    }

    /* ── RADIAL VIGNETTE ── */
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse 70% 65% at 50% 50%, transparent 0%, rgba(7,7,15,0.72) 100%);
      pointer-events: none;
    }

    /* ── CONNECT LINK ── */
    .connect {
      position: fixed;
      top: 32px; right: 44px;
      z-index: 100;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 9px;
      transition: color 0.3s;
      opacity: 0;
      animation: fadeIn 1s cubic-bezier(0.22,1,0.36,1) 2s forwards;
    }
    .connect:hover { color: var(--accent); }
    .connect::after {
      content: '';
      display: block;
      width: 18px; height: 1px;
      background: currentColor;
      transition: width 0.35s cubic-bezier(0.22,1,0.36,1);
    }
    .connect:hover::after { width: 30px; }

    /* ── CENTRE STAGE ── */
    .stage {
      position: fixed; inset: 0; z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* ── LOGO MARK ── */
    .logo-wrap {
      opacity: 0;
      transform: translateY(16px);
      animation: riseIn 1s cubic-bezier(0.22,1,0.36,1) 0.3s forwards;
      line-height: 1;
    }

    .logo-pi {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(52px, 7vw, 86px);
      letter-spacing: -0.03em;
      color: var(--fg);
      line-height: 1;
    }

    .logo-dot {
      color: var(--accent);
      display: inline-block;
    }

    /* ── STUDIOS TYPEWRITER ── */
    .logo-studios {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 0;
      height: 1.2em;
    }

    .logo-studios-text {
      font-family: var(--mono);
      font-weight: 300;
      font-size: clamp(8px, 1vw, 11px);
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .logo-cursor {
      display: inline-block;
      width: 2px;
      height: clamp(8px, 1vw, 11px);
      background: var(--accent);
      margin-left: 2px;
      opacity: 0;
      flex-shrink: 0;
    }

    .logo-cursor.visible  { opacity: 1; }
    .logo-cursor.blink    { animation: blinkCursor 0.8s step-end infinite; }

    /* ── BOTTOM FOOTER BLOCK ── */
    .footer {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0;
      animation: fadeIn 1s ease 2.2s forwards;
      white-space: nowrap;
    }

    .services {
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(110,110,138,0.45);
    }

    .services span {
      color: rgba(201,162,39,0.3);
      margin: 0 5px;
    }

    .location {
      font-family: var(--mono);
      font-size: 7.5px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(110,110,138,0.22);
    }

    /* ── KEYFRAMES ── */
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0);    }
    }
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }
  </style>
</head>
<body>

  <a class="connect" href="mailto:hello@pidatastudios.com.au">Connect</a>

  <div class="stage">
    <div class="logo-wrap">
      <div class="logo-pi">Pi<span class="logo-dot">.</span></div>
      <div class="logo-studios">
        <span class="logo-studios-text"></span><span class="logo-cursor"></span>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="services">
      Problem-solving<span>·</span>Building<span>·</span>Simplifying
    </div>
    <div class="location">Melbourne<span>·</span>Australia</div>
  </div>

  <script>
    var word     = 'Studios';
    var delay    = 1400;  /* ms before typing begins — lets the logo rise in first */
    var interval = 80;    /* ms per character */

    var textEl   = document.querySelector('.logo-studios-text');
    var cursorEl = document.querySelector('.logo-cursor');

    setTimeout(function () {
      cursorEl.classList.add('visible'); /* show cursor before typing starts */

      var i = 0;
      var timer = setInterval(function () {
        textEl.textContent = word.slice(0, i + 1);
        i++;
        if (i === word.length) {
          clearInterval(timer);
          cursorEl.classList.remove('visible');
          cursorEl.classList.add('blink'); /* switch to blinking once done */
        }
      }, interval);
    }, delay);
  </script>

</body>
</html>
